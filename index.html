<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11151a">
  <title>Abhi's Movies &amp; Series Library</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11151a;
      --panel: rgba(255, 255, 255, .06);
      --panel-strong: rgba(255, 255, 255, .1);
      --line: rgba(255, 255, 255, .12);
      --text: #f3f5f7;
      --muted: #a4adb7;
      --subtle: #76818c;
      --accent: #c6d5e2;
      --accent-dark: #26333f;
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 12% -4%, rgba(65, 77, 95, .26), transparent 35rem),
        radial-gradient(ellipse at 96% 15%, rgba(108, 67, 39, .16), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .shell { width: min(1480px, 100%); margin: 0 auto; padding: 24px clamp(16px, 4vw, 60px) 56px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 25px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--text); text-decoration: none; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 12px; background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -.035em; }
    .brand-caption { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; }
    .topbar-end { display: flex; align-items: center; gap: 12px; }
    .collection-count { color: var(--muted); font-size: 12px; }

    .intro { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 205px); align-items: center; gap: 26px; min-height: 340px; margin: 28px 0 25px; padding: clamp(24px, 4vw, 42px); overflow: hidden; border: 1px solid rgba(255,255,255,.12); border-radius: 26px; background: #17191e; box-shadow: 0 28px 90px rgba(0,0,0,.28); isolation: isolate; }
    .spotlight-backdrop { position: absolute; z-index: -2; inset: 0; overflow: hidden; }
    .spotlight-backdrop img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; opacity: .35; filter: blur(1px) saturate(.75); transform: scale(1.04); transition: opacity .35s ease; }
    .intro::before { position: absolute; z-index: -1; inset: 0; content: ""; background: linear-gradient(90deg, #14161b 0%, rgba(20,22,27,.96) 34%, rgba(20,22,27,.68) 65%, rgba(20,22,27,.42) 100%), linear-gradient(0deg, rgba(10,11,14,.64), transparent 58%); }
    .intro-copy { position: relative; z-index: 1; max-width: 680px; align-self: center; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    .intro h1 { max-width: 680px; margin: 0; font-size: clamp(32px, 5vw, 58px); font-weight: 700; letter-spacing: -.055em; line-height: 1.03; text-wrap: balance; }
    .intro-copy > p:last-of-type { max-width: 510px; margin: 13px 0 0; color: rgba(244,244,241,.76); font-size: 13px; line-height: 1.65; }
    .spotlight-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .spotlight-chip { padding: 5px 9px; border: 1px solid rgba(255,255,255,.2); border-radius: 100px; background: rgba(12,14,18,.28); color: rgba(255,255,255,.78); font-size: 9px; backdrop-filter: blur(10px); }
    .spotlight-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
    .spotlight-open { min-height: 40px; padding: 0 15px; border: 0; border-radius: 9px; background: #f2f1ed; color: #15161a; cursor: pointer; font-size: 11px; font-weight: 750; transition: background .2s, transform .2s; }
    .spotlight-open:hover { transform: translateY(-1px); background: #fff; }
    .spotlight-controls { display: flex; gap: 7px; }
    .spotlight-arrow { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid rgba(255,255,255,.25); border-radius: 50%; background: rgba(12,14,18,.3); color: white; cursor: pointer; font-size: 19px; backdrop-filter: blur(12px); }
    .spotlight-arrow:hover { background: rgba(255,255,255,.16); }
    .spotlight-picks { position: relative; z-index: 1; display: flex; grid-column: 1 / -1; justify-content: center; gap: 8px; margin-top: -4px; padding: 7px; }
    .spotlight-pick { width: 7px; height: 7px; flex: 0 0 auto; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.42); cursor: pointer; transition: width .22s ease, transform .22s ease, background .22s ease; }
    .spotlight-pick:hover { transform: scale(1.25); background: rgba(255,255,255,.82); }
    .spotlight-pick[aria-pressed="true"] { width: 23px; border-radius: 100px; background: var(--accent); }
    [hidden] { display: none !important; }

    .filters { display: grid; grid-template-columns: minmax(170px, 1fr) auto auto; align-items: center; gap: 12px; margin-bottom: 24px; padding: 12px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.035); }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; top: 50%; left: 14px; width: 16px; height: 16px; transform: translateY(-50%); color: var(--subtle); pointer-events: none; }
    .search-input, .genre-select { width: 100%; min-height: 42px; border: 1px solid transparent; border-radius: 11px; background: rgba(0,0,0,.18); color: var(--text); font-size: 12px; }
    .search-input { padding: 0 14px 0 40px; }
    .search-input::placeholder { color: var(--subtle); }
    .genre-select { min-width: 150px; padding: 0 34px 0 12px; border-color: var(--line); cursor: pointer; }
    .genre-select option { background: #17191e; color: var(--text); }
    .filter-group { display: flex; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: rgba(0,0,0,.16); }
    .filter-button { min-height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 650; white-space: nowrap; transition: .18s ease; }
    .filter-button:hover { background: rgba(255,255,255,.07); color: var(--text); }
    .filter-button[aria-pressed="true"] { background: rgba(255,255,255,.13); color: var(--text); box-shadow: inset 0 1px rgba(255,255,255,.08); }
    .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .filter-row h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.025em; }
    .filter-row p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .results-count { color: var(--muted); font-size: 11px; white-space: nowrap; }

    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 21px 16px; }
    .movie-card { min-width: 0; cursor: pointer; outline: none; }
    .poster { position: relative; aspect-ratio: 2 / 2.85; overflow: hidden; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; background: linear-gradient(150deg, #30343a, #17191d 70%); box-shadow: 0 12px 28px rgba(0,0,0,.24); transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
    .movie-card:hover .poster, .movie-card:focus-visible .poster { transform: translateY(-5px) scale(1.015); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 20px 36px rgba(0,0,0,.38); }
    .poster img { display: block; width: 100%; height: 100%; object-fit: contain; background: #1a1c20; }
    .poster-fallback { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 17px; overflow: hidden; background: radial-gradient(ellipse at 50% 22%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 42%), linear-gradient(145deg, #343944, #121419 75%); text-align: center; }
    .poster-fallback[hidden] { display: none; }
    .fallback-mark { margin-bottom: 15px; color: var(--accent); font-size: 28px; }
    .fallback-title { font-family: Georgia, serif; font-size: clamp(15px, 2vw, 21px); font-weight: 700; line-height: 1.15; text-wrap: balance; }
    .poster-shade { position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, rgba(0,0,0,.56)); pointer-events: none; }
    .poster-badge { position: absolute; z-index: 1; top: 9px; left: 9px; max-width: calc(100% - 18px); padding: 5px 8px; border: 1px solid rgba(255,255,255,.15); border-radius: 100px; background: rgba(9,10,13,.66); color: rgba(255,255,255,.92); font-size: 8px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; backdrop-filter: blur(10px); }
    .hall-of-fame-heart { position: absolute; z-index: 2; top: 8px; right: 8px; display: grid; width: 29px; height: 29px; place-items: center; border: 1px solid rgba(255,255,255,.55); border-radius: 50%; background: rgba(20,20,20,.55); color: #e53946; font-size: 16px; line-height: 1; text-shadow: 0 1px 5px rgba(0,0,0,.35); backdrop-filter: blur(8px); }
    .movie-card[data-status="watched"] .poster-badge { border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: #fff; }
    .card-meta { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 10px 2px 0; }
    .card-title { margin: 0; overflow: hidden; color: #f0efec; font-size: 12px; font-weight: 650; letter-spacing: -.01em; line-height: 1.35; text-overflow: ellipsis; }
    .card-subtitle { margin: 4px 0 0; overflow: hidden; color: #858791; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .card-kind { flex: 0 0 auto; margin-top: 1px; color: #757781; font-size: 8px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .empty-state { grid-column: 1 / -1; display: grid; min-height: 245px; place-items: center; padding: 28px; border: 1px dashed rgba(255,255,255,.15); border-radius: 20px; background: rgba(255,255,255,.025); text-align: center; }
    .empty-icon { display: grid; width: 50px; height: 50px; margin: 0 auto 14px; place-items: center; border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: 16px; background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--accent); }
    .empty-state h3 { margin: 0; font-size: 16px; }
    .empty-state p { max-width: 360px; margin: 8px 0 17px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); color: #62646d; font-size: 10px; text-align: center; }

    .modal-backdrop { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(3,4,7,.72); backdrop-filter: blur(14px); }
    .modal-backdrop[hidden] { display: none; }
    .dialog { width: min(640px, 100%); max-height: min(90vh, 850px); overflow: auto; border: 1px solid rgba(255,255,255,.17); border-radius: 23px; background: rgba(27,29,34,.9); box-shadow: 0 30px 100px rgba(0,0,0,.5), inset 0 1px rgba(255,255,255,.08); backdrop-filter: blur(24px) saturate(140%); }
    .dialog-header { display: flex; align-items: flex-start; justify-content: flex-end; gap: 20px; padding: 18px 22px 0; border-bottom: 0; }
    .dialog-kicker { margin: 0 0 5px; color: var(--accent); font-size: 9px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .dialog-close { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: rgba(255,255,255,.055); color: var(--muted); cursor: pointer; font-size: 19px; }
    .dialog-close:hover { background: rgba(255,255,255,.12); color: var(--text); }
    .detail-layout { display: grid; grid-template-columns: minmax(130px, 190px) minmax(0, 1fr); gap: 22px; padding: 24px; }
    .detail-poster { position: relative; aspect-ratio: 2 / 2.85; overflow: hidden; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; background: #17191d; }
    .detail-poster img { width: 100%; height: 100%; object-fit: contain; }
    .detail-info { min-width: 0; }
    .detail-kinds { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .detail-chip { padding: 5px 8px; border: 1px solid var(--line); border-radius: 100px; color: var(--muted); font-size: 9px; }
    .detail-title { margin: 0; font-size: clamp(22px, 4vw, 30px); letter-spacing: -.045em; line-height: 1.12; }
    .detail-meta { margin: 7px 0 0; color: var(--muted); font-size: 11px; }
    .detail-description { margin: 19px 0; color: #c1c0c0; font-size: 12px; line-height: 1.7; white-space: pre-wrap; }

    @media (min-width: 1500px) { .movie-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 25px 19px; } }
    @media (max-width: 850px) {
      .filters { grid-template-columns: 1fr 1fr; }
      .search-wrap { grid-column: 1 / -1; }
      .genre-select { min-width: 0; }
      .intro { grid-template-columns: minmax(0, 1fr) 145px; gap: 18px; }
    }
    @media (max-width: 560px) {
      .shell { padding-top: 15px; }
      .topbar { padding-bottom: 17px; }
      .collection-count { display: none; }
      .intro { min-height: 0; grid-template-columns: minmax(0, 1fr) 92px; gap: 11px; margin-top: 19px; padding: 22px 16px 18px; border-radius: 20px; }
      .intro h1 { max-width: 340px; font-size: 35px; }
      .intro-copy > p:last-child { font-size: 12px; }
      .spotlight-meta { gap: 5px; margin-top: 10px; }
      .spotlight-chip { padding: 4px 7px; font-size: 8px; }
      .spotlight-actions { gap: 7px; margin-top: 12px; }
      .spotlight-open { min-height: 35px; padding: 0 11px; font-size: 10px; }
      .spotlight-arrow { width: 33px; height: 33px; }
      .spotlight-picks { margin-top: 0; }
      .filters { gap: 8px; padding: 9px; }
      .filter-button { padding: 0 9px; font-size: 10px; }
      .filter-group { width: 100%; justify-content: space-around; }
      .genre-select { width: 100%; font-size: 11px; }
      .movie-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 19px 12px; }
      .poster { border-radius: 12px; }
      .card-title { font-size: 11px; }
      .dialog-header { padding: 19px 18px 15px; }
      .detail-layout { grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 17px; }
      .detail-description { grid-column: 1 / -1; margin: 14px 0; }
      .detail-info { display: contents; }
      .detail-kinds, .detail-title, .detail-meta, .detail-status-control, .detail-status-hint { grid-column: 2; }
      .detail-kinds { align-self: end; margin-bottom: -8px; }
      .detail-title { align-self: start; }
      .detail-description { grid-row: 2; }
      .detail-poster { grid-row: 1 / span 2; }
    }

    /* Crisp, reduced-noise visual pass. */
    body {
      background: #141414;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    }

    }

      background: rgba(229,9,20,.1);

    }
    .intro {

    }

    }

    }

    }

    }
    .movie-card:hover .poster, .movie-card:focus-visible .poster { transform: none; }
    .rating-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      margin-top: 7px;

      border: 1px solid rgba(255,255,255,.1);
      border-radius: 7px;
      background: rgba(0,0,0,.25);
    }
    .rating-stars {
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      font-size: 11px;
      letter-spacing: .02em;
      line-height: 1;
    }
    .rating-value { color: #d6d6d6; font-size: 9px; font-weight: 700; }
    .glass-review {
      margin-top: 17px;
      padding: 15px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 14px;
      background: rgba(255,255,255,.055);
      box-shadow: inset 0 1px rgba(255,255,255,.06), 0 10px 24px rgba(0,0,0,.14);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      backdrop-filter: blur(18px) saturate(130%);
    }
    .glass-review-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.09); }
    .glass-review-title { margin: 0; color: #f1f1f1; font-size: 10px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .glass-review-copy { margin: 11px 0 0; color: #c5c5c5; font-size: 11px; line-height: 1.75; white-space: pre-wrap; }
    .glass-synopsis { margin-top: 14px; color: #a9a9a9; font-size: 11px; line-height: 1.7; }

      border-color: rgba(229,9,20,.45);
      background: rgba(229,9,20,.88);

        <button class="filter-button" type="button" data-status="all" aria-pressed="true">All status</button>
        <button class="filter-button" type="button" data-status="to-watch" aria-pressed="false">To watch</button>
        <button class="filter-button" type="button" data-status="in-progress" aria-pressed="false">In progress</button>
        <button class="filter-button" type="button" data-status="watched" aria-pressed="false">Watched</button>
      </div>
    </section>

    <main>
      <div class="filter-row">
        <div><h2 id="collection-heading">Your collection</h2><p id="search-help">Search a tag, or separate terms with commas to match all of them.</p></div>
        <span id="results-count" class="results-count">0 titles</span>
      </div>
      <section id="movie-grid" class="movie-grid" aria-label="Movies and series"></section>
    </main>
    <footer class="footer">ABHI'S MOVIES &amp; SERIES LIBRARY <span aria-hidden="true">·</span> Made for the stories you keep <span aria-hidden="true">·</span> Poster images sourced from TMDB</footer>
  </div>

  <div id="detail-modal" class="modal-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <header class="dialog-header">
        <button class="dialog-close" type="button" data-close aria-label="Close details">×</button>
      </header>
      <div id="detail-content"></div>
    </section>
  </div>

  <script>
    (() => {
      // Movie and series records live in movies.json for easy offline editing.
      const state = { items: [], type: 'all', status: 'all', genre: 'all', tag: '', query: '' };
      const statusLabels = { 'to-watch': 'To watch', 'in-progress': 'In progress', watched: 'Watched' };
      const $ = (selector, root = document) => root.querySelector(selector);
      const grid = $('#movie-grid');
      const detailModal = $('#detail-modal');
      let spotlightItems = [];
      let spotlightIndex = 0;
      let lastFocusedElement = null;
      let spotlightFadeTimeout = null;

      function parseTags(value) {
        const seen = new Set();
        const values = Array.isArray(value) ? value : typeof value === 'string' ? value.split(',') : [];
        return values.filter(value => typeof value === 'string').map(tag => tag.trim()).filter(tag => {
          const key = tag.toLocaleLowerCase();
          if (!key || seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function readStatusOverrides() {
        try {
          const saved = JSON.parse(localStorage.getItem('abhi-movies-status-overrides') || '{}');
          return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
        } catch {
          return {};
        }
      }

      function updateItemStatus(id, status) {
        const item = state.items.find(entry => entry.id === id);
        if (!item || !Object.prototype.hasOwnProperty.call(statusLabels, status)) return;
        item.status = status;
        try {
          const overrides = readStatusOverrides();
          overrides[id] = status;
          localStorage.setItem('abhi-movies-status-overrides', JSON.stringify(overrides));
        } catch (error) {
          console.warn('Could not save this status in browser storage.', error);
        }
        render();
        openDetails(id);
      }

      function showLoadMessage(message) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        const content = document.createElement('div');
        const title = document.createElement('h3');
        title.textContent = message;
        const description = document.createElement('p');
        description.textContent = 'Use a local web server to preview the page, or check that movies.json is present beside index.html.';
        content.append(title, description);
        empty.append(content);
        grid.replaceChildren(empty);
      }

      async function loadCollection() {
        try {
          const response = await fetch('./movies.json');
          if (!response.ok) throw new Error(`Could not load movies.json (${response.status})`);
          const collection = await response.json();
          if (!Array.isArray(collection)) throw new Error('movies.json must contain a JSON array');
          const statusOverrides = readStatusOverrides();
          state.items = collection.filter(item =>
            item && typeof item.id === 'string' && typeof item.title === 'string' &&
            ['movie', 'series'].includes(item.type) && ['watched', 'to-watch', 'in-progress'].includes(statusOverrides[item.id] || item.status)
          ).map(item => ({
            ...item,
            status: ['watched', 'to-watch', 'in-progress'].includes(statusOverrides[item.id]) ? statusOverrides[item.id] : item.status
          }));
          state.items = state.items.map(item => ({
            ...item,
            tags: parseTags(item.tags).join(', ')
          }));
          renderTags();
          spotlightItems = filteredItems().slice(0, 5);
          spotlightIndex = 0;
          render();
        } catch (error) {
          console.error(error);
          showLoadMessage('Could not load the movie library');
        }
      }

      function makePoster(title, posterUrl, className = '', hallOfFame = false) {
        const wrapper = document.createElement('div');
        wrapper.className = `poster ${className}`.trim();
        const badge = document.createElement('span');
        badge.className = 'poster-badge';
        badge.textContent = 'Your collection';
        wrapper.append(badge);
        if (hallOfFame) {
          const heart = document.createElement('span');
          heart.className = 'hall-of-fame-heart';
          heart.textContent = '♥';
          heart.setAttribute('role', 'img');
          heart.setAttribute('aria-label', 'Hall of Fame');
          heart.title = 'Hall of Fame';
          wrapper.append(heart);
        }

        const fallback = document.createElement('div');
        fallback.className = 'poster-fallback';
        const mark = document.createElement('span');
        mark.className = 'fallback-mark';
        mark.textContent = '✦';
        const fallbackTitle = document.createElement('span');
        fallbackTitle.className = 'fallback-title';
        fallbackTitle.textContent = title;
        fallback.append(mark, fallbackTitle);

        if (posterUrl) {
          const image = document.createElement('img');
          image.src = posterUrl;
          image.alt = `${title} poster`;
          image.loading = 'lazy';
          image.onerror = () => { image.remove(); fallback.hidden = false; };
          fallback.hidden = true;
          wrapper.append(image, fallback);
        } else {
          wrapper.append(fallback);
        }
        const shade = document.createElement('span');
        shade.className = 'poster-shade';
        wrapper.append(shade);
        return wrapper;
      }

      function makeRatingBadge(item) {
        if (item.status !== 'watched' || !Number.isFinite(Number(item.rating))) return null;
        const rating = Math.max(0, Math.min(5, Number(item.rating)));
        const badge = document.createElement('span');
        badge.className = 'rating-badge';
        badge.setAttribute('aria-label', `Rating ${rating} out of 5 stars`);
        const stars = document.createElement('span');
        stars.className = 'rating-stars';
        stars.setAttribute('aria-hidden', 'true');
        stars.textContent = '★★★★★';
        const filled = `${rating / 5 * 100}%`;
        stars.style.backgroundImage = `linear-gradient(90deg, #f5b50a 0%, #f5b50a ${filled}, rgba(255,255,255,.25) ${filled}, rgba(255,255,255,.25) 100%)`;
        const value = document.createElement('span');
        value.className = 'rating-value';
        value.textContent = `${rating}/5`;
        badge.append(stars, value);
        return badge;
      }

      function renderGenres() {
        const genreFilter = $('#genre-filter');
        const current = state.genre;
        const usedGenres = [...new Set(state.items.map(item => item.genre).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        genreFilter.replaceChildren(new Option('All genres', 'all'));
        usedGenres.forEach(genre => genreFilter.add(new Option(genre, genre)));
        genreFilter.value = usedGenres.includes(current) ? current : 'all';
        state.genre = genreFilter.value;
      }

      function renderTags() {
        const tagFilter = $('#tag-filter');
        const tags = new Map();
        state.items.forEach(item => parseTags(item.tags).forEach(tag => {
          const key = tag.toLocaleLowerCase();
          if (!tags.has(key)) tags.set(key, tag);
        }));
        tagFilter.replaceChildren(new Option('All tags', ''));
        [...tags].sort((a, b) => a[1].localeCompare(b[1])).forEach(([key, label]) => {
          tagFilter.add(new Option(label, key));
        });
        tagFilter.value = tags.has(state.tag) ? state.tag : '';
        state.tag = tagFilter.value;
      }

      function filteredItems() {
        const terms = state.query.toLocaleLowerCase().split(',').map(term => term.trim()).filter(Boolean);
        return state.items.filter(item => {
          const matchesType = state.type === 'all' || item.type === state.type;
          const matchesStatus = state.status === 'all' || item.status === state.status;
          const matchesGenre = state.genre === 'all' || item.genre === state.genre;
          const matchesTag = !state.tag || parseTags(item.tags).some(tag => tag.toLocaleLowerCase() === state.tag);
          const searchable = `${item.title} ${item.genre} ${item.year || ''} ${item.review || ''} ${parseTags(item.tags).join(' ')}`.toLocaleLowerCase();
          const matchesQuery = terms.every(term => searchable.includes(term));
          return matchesType && matchesStatus && matchesGenre && matchesTag && matchesQuery;
        });
      }

      function renderSpotlight() {
        spotlightItems = filteredItems().slice(0, 5);
        const picks = $('#spotlight-picks');
        const hasItems = spotlightItems.length > 0;
        $('#spotlight-open').hidden = !hasItems;
        $('.spotlight-controls').hidden = !hasItems;
        picks.hidden = !hasItems;
        if (!hasItems) {
          $('#spotlight-kicker').textContent = 'Your collection';
          $('#page-title').textContent = 'No titles in this view';
          $('#spotlight-meta').replaceChildren();
          $('#spotlight-backdrop-image').removeAttribute('src');
          picks.replaceChildren();
          return;
        }

        spotlightIndex = Number.isFinite(spotlightIndex) ? spotlightIndex % spotlightItems.length : 0;
        const item = spotlightItems[spotlightIndex];

        const currentGenre = state.genre !== 'all' ? state.genre : '';
        const currentStatus = state.status !== 'all' ? statusLabels[state.status] : '';
        const currentType = state.type !== 'all' ? (state.type === 'series' ? 'Series' : 'Movies') : '';
        const currentTag = state.tag ? $('#tag-filter').selectedOptions[0].textContent : '';
        const filterLabel = [currentType, currentStatus, currentGenre, currentTag].filter(Boolean).join(' · ');
        $('#spotlight-kicker').textContent = filterLabel || 'Featured from your collection';
        const copy = $('.intro-copy');
        copy.classList.add('is-switching');
        window.clearTimeout(spotlightFadeTimeout);
        spotlightFadeTimeout = window.setTimeout(() => copy.classList.remove('is-switching'), 240);
        $('#page-title').textContent = item.title;

        const backdrop = $('#spotlight-backdrop-image');
        backdrop.style.opacity = '.08';
        backdrop.onload = () => { backdrop.style.opacity = ''; };
        backdrop.onerror = () => { backdrop.style.opacity = ''; };
        backdrop.src = item.poster;
        backdrop.alt = '';

        const meta = $('#spotlight-meta');
        meta.replaceChildren();
        [item.year, item.genre, item.type === 'series' ? 'Series' : 'Movie', statusLabels[item.status]].forEach(value => {
          const chip = document.createElement('span');
          chip.className = 'spotlight-chip';
          chip.textContent = value;
          meta.append(chip);
        });

        picks.replaceChildren();
        spotlightItems.forEach((spotlightItem, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'spotlight-pick';
          button.setAttribute('aria-label', `Show featured title ${index + 1}: ${spotlightItem.title}`);
          button.setAttribute('aria-pressed', String(index === spotlightIndex));
          button.title = spotlightItem.title;
          button.addEventListener('click', () => {
            spotlightIndex = index;
            renderSpotlight();
          });
          picks.append(button);
        });

        $('#spotlight-open').onclick = () => openDetails(item.id);
      }

      function render() {
        renderGenres();
        const visibleItems = filteredItems();
        renderSpotlight();
        $('#top-count').textContent = `${state.items.length} ${state.items.length === 1 ? 'title' : 'titles'} in your library`;
        $('#results-count').textContent = `${visibleItems.length} ${visibleItems.length === 1 ? 'title' : 'titles'}`;
        $('#collection-heading').textContent = state.type === 'movie' ? 'Your movies' : state.type === 'series' ? 'Your series' : state.status !== 'all' ? statusLabels[state.status] : state.genre !== 'all' ? state.genre : 'Your collection';
        grid.replaceChildren();

        if (!visibleItems.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          const content = document.createElement('div');
          const icon = document.createElement('div');
          icon.className = 'empty-icon';
          icon.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
          const title = document.createElement('h3');
          title.textContent = 'No titles match those filters';
          const description = document.createElement('p');
          description.textContent = 'Try another format, status, genre, or tag. Comma-separated search terms must all match.';
          content.append(icon, title, description);
          empty.append(content);
          grid.append(empty);
          return;
        }

        visibleItems.forEach(item => {
          const card = document.createElement('article');
          card.className = 'movie-card';
          card.dataset.status = item.status;
          card.tabIndex = 0;
          card.setAttribute('role', 'button');
          card.setAttribute('aria-label', `View ${item.title} details`);
          const poster = makePoster(item.title, item.poster, '', item.hallOfFame === true);
          poster.querySelector('.poster-badge').textContent = statusLabels[item.status];
          const meta = document.createElement('div');
          meta.className = 'card-meta';
          const text = document.createElement('div');
          text.style.minWidth = '0';
          const title = document.createElement('h3');
          title.className = 'card-title';
          title.textContent = item.title;
          const subtitle = document.createElement('p');
          subtitle.className = 'card-subtitle';
          subtitle.textContent = [item.genre, item.year].filter(Boolean).join(' · ') || 'Genre not set';
          text.append(title, subtitle);
          const ratingBadge = makeRatingBadge(item);
          if (ratingBadge) text.append(ratingBadge);
          const kind = document.createElement('span');
          kind.className = 'card-kind';
          kind.textContent = item.type === 'series' ? 'Series' : 'Film';
          meta.append(text, kind);
          card.append(poster, meta);
          card.addEventListener('click', () => openDetails(item.id));
          card.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openDetails(item.id);
            }
          });
          grid.append(card);
        });
      }

      function openModal(modal) {
        lastFocusedElement = document.activeElement;
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        const focusTarget = modal.querySelector('input, button, select, textarea');
        if (focusTarget) focusTarget.focus();
      }

      function closeModal(modal) {
        modal.hidden = true;
        if (detailModal.hidden) document.body.style.overflow = '';
        if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') lastFocusedElement.focus();
      }

      function openDetails(id) {
        const item = state.items.find(entry => entry.id === id);
        if (!item) return;
        const content = $('#detail-content');
        content.replaceChildren();
        const layout = document.createElement('div');
        layout.className = 'detail-layout';
        const poster = makePoster(item.title, item.poster, 'detail-poster', item.hallOfFame === true);
        poster.querySelector('.poster-badge').textContent = statusLabels[item.status];
        const info = document.createElement('div');
        info.className = 'detail-info';
        const chips = document.createElement('div');
        chips.className = 'detail-kinds';
        [item.type === 'series' ? 'Series' : 'Movie', item.genre, item.year].filter(Boolean).forEach(value => {
          const chip = document.createElement('span');
          chip.className = 'detail-chip';
          chip.textContent = value;
          chips.append(chip);
        });
        const title = document.createElement('h3');
        title.className = 'detail-title';
        title.id = 'detail-title';
        title.textContent = item.title;
        const statusControl = document.createElement('label');
        statusControl.className = 'detail-status-control';
        statusControl.textContent = 'Watch status';
        const statusSelect = document.createElement('select');
        statusSelect.className = 'detail-status-select';
        statusSelect.setAttribute('aria-label', `Watch status for ${item.title}`);
        Object.entries(statusLabels).forEach(([value, label]) => statusSelect.add(new Option(label, value, false, item.status === value)));
        statusSelect.addEventListener('change', () => updateItemStatus(item.id, statusSelect.value));
        statusControl.append(statusSelect);
        const statusHint = document.createElement('p');
        statusHint.className = 'detail-status-hint';
        statusHint.textContent = 'Status changes are saved in this browser.';
        const reviewPanel = document.createElement('section');
        reviewPanel.className = 'glass-review';
        const ratingBadge = makeRatingBadge(item);
        const review = document.createElement('p');
        review.className = 'glass-review-copy';
        review.textContent = item.review || 'No review added yet.';
        if (ratingBadge) reviewPanel.append(ratingBadge);
        reviewPanel.append(review);
        const tagList = document.createElement('div');
        tagList.className = 'tag-list';
        tagList.setAttribute('aria-label', 'Tags');
        parseTags(item.tags).forEach(tag => {
          const chip = document.createElement('span');
          chip.className = 'detail-chip';
          chip.textContent = tag;
          tagList.append(chip);
        });
        info.append(chips, title, statusControl, statusHint, reviewPanel);
        if (tagList.childElementCount) info.append(tagList);
        layout.append(poster, info);
        content.append(layout);
        openModal(detailModal);
      }

      grid.classList.add('is-loading');
      showLoadMessage('Loading your collection…');
      loadCollection().finally(() => grid.classList.remove('is-loading'));
      $('#spotlight-previous').addEventListener('click', () => {
        if (!spotlightItems.length) return;
        spotlightIndex = (spotlightIndex - 1 + spotlightItems.length) % spotlightItems.length;
        renderSpotlight();
      });
      $('#spotlight-next').addEventListener('click', () => {
        if (!spotlightItems.length) return;
        spotlightIndex = (spotlightIndex + 1) % spotlightItems.length;
        renderSpotlight();
      });

      document.querySelectorAll('[data-type]').forEach(button => button.addEventListener('click', () => {
        state.type = button.dataset.type;
        spotlightIndex = 0;
        document.querySelectorAll('[data-type]').forEach(option => option.setAttribute('aria-pressed', String(option === button)));
        render();
      }));
      document.querySelectorAll('[data-status]').forEach(button => button.addEventListener('click', () => {
        state.status = button.dataset.status;
        spotlightIndex = 0;
        document.querySelectorAll('[data-status]').forEach(option => option.setAttribute('aria-pressed', String(option === button)));
        render();
      }));
      $('#genre-filter').addEventListener('change', event => { state.genre = event.target.value; spotlightIndex = 0; render(); });
      $('#tag-filter').addEventListener('change', event => { state.tag = event.target.value; spotlightIndex = 0; render(); });
      $('#search').addEventListener('input', event => { state.query = event.target.value; spotlightIndex = 0; render(); });

      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.setInterval(() => {
          if (spotlightItems.length < 2) return;
          spotlightIndex = (spotlightIndex + 1) % spotlightItems.length;
          renderSpotlight();
        }, 6000);
      }

      document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => closeModal(detailModal)));
      [detailModal].forEach(modal => modal.addEventListener('click', event => {
        if (event.target === modal) closeModal(modal);
      }));
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !detailModal.hidden) closeModal(detailModal);
      });
    })();
  </script>
</body>
</html>
